
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parkseoyeon</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #d4d4d4;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 8px;
            color: #111;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        h1 {
            font-size: 24px;
            font-weight: normal;
            margin: 0;
        }

        h1 a {
            color: #111;
            text-decoration: none;
        }

        /* 메인 페이지 목차 */

        .menu {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        .menu a {
            font-size: 16px;
            color: #111;
            text-decoration: none;
        }

        .menu a:hover {
            opacity: 0.5;
        }

        /* 뒤로 가기 화살표 */

        .back {
            display: block;
            margin-top: 8px;
            font-size: 16px;
            color: #111;
            text-decoration: none;
        }

        .back:hover {
            opacity: 0.5;
        }

        /* 페이지 전환 */

        #work-page,
        #statement-page,
        #cv-page {
            display: none;
        }

        #work-page:target,
        #statement-page:target,
        #cv-page:target {
            display: block;
        }

        #work-page:target ~ #home-page,
        #statement-page:target ~ #home-page,
        #cv-page:target ~ #home-page {
            display: none;
        }

        /* 작품 리스트 */

        .work-list {
            margin-top: 50px;
        }

        .work-item {
            margin-bottom: 20px;
            font-size: 20px;
        }

        .work-item a {
            color: #111;
            text-decoration: none;
        }

        .work-item a:hover {
            text-decoration: underline;
        }

        /* Artist statement와 CV 화면 */

        .page-content {
            margin-top: 50px;
            font-size: 16px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <!-- 작품 리스트 화면 -->
    <section id="work-page">

        <header>
            <div>
                <h1>
                    <a href="index.html">Parkseoyeon</a>
                </h1>

                <a class="back" href="index.html">←</a>
            </div>

            <div>Work</div>
        </header>

        <div class="work-list">

            <div class="work-item">
                <a href="#">Everything is life 2023</a>
            </div>

            <div class="work-item">
                <a href="#">Inner place 2024</a>
            </div>

            <div class="work-item">
                <a href="#">Inner place (un - labeled) 2024</a>
            </div>

            <div class="work-item">
                <a href="#">돌 봄 2025</a>
            </div>

            <div class="work-item">
                <a href="#">이렇게 밥상에 모였다. 2026</a>
            </div>

        </div>

    </section>


    <!-- Artist statement 화면 -->
    <section id="statement-page">

        <header>
            <div>
                <h1>
                    <a href="index.html">Parkseoyeon</a>
                </h1>

                <a class="back" href="index.html">←</a>
            </div>

            <div>Artist statement</div>
        </header>

        <div class="page-content">
            Artist statement
        </div>

    </section>


    <!-- CV 화면 -->
    <section id="cv-page">

        <header>
            <div>
                <h1>
                    <a href="index.html">Parkseoyeon</a>
                </h1>

                <a class="back" href="index.html">←</a>
            </div>

            <div>CV</div>
        </header>

        <div class="page-content">
            CV
        </div>

    </section>


    <!-- 메인 페이지 -->
    <section id="home-page">

        <header>
            <h1>Parkseoyeon</h1>
        </header>

        <nav class="menu">

            <a href="#statement-page">Artist statement</a>

            <a href="#cv-page">CV</a>

            <a href="#work-page">Work</a>

        </nav>

    </section>

</body>
</html>
