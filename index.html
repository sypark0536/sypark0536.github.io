
<script>
    const trail = document.getElementById("cursor-trail");

    const balls = [];
    const ballCount = 14;

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;

    let isMoving = false;
    let moveTimer;

    /* 기본 색상 */
    const defaultColors = [
        "#ff69b4",
        "#ff1493",
        "#ff8fab",
        "#ffb3c6",
        "#c77dff",
        "#9d4edd",
        "#7b2cbf",
        "#00b4d8",
        "#48cae4",
        "#90be6d",
        "#f9c74f",
        "#f9844a",
        "#f94144"
    ];

    let currentColors = defaultColors;

    /*
     * 작품별 사진 파일
     * 사진에서 색을 추출해 해당 페이지의 공에 적용
     */
    const pageImages = {
        "dolbom-page": [
            "DSC01305.JPG",
            "DSC01300.JPG",
            "DSC01312.JPG",
            "DSC01313.JPG",
            "DSC01432.JPG",
            "DSC01437.JPG",
            "DSC01438.JPG",
            "DSC01440.JPG"
        ],

        "innerplace-page": [
            "1-60.png",
            "2-60.png",
            "3-60.png",
            "4-60.png"
        ],

        "bapsang-page": [
            "DSC02107.JPG",
            "DSC02125.JPG",
            "DSC02159.JPG",
            "DSC02164.JPG",
            "DSC02173.JPG",
            "DSC02205.JPG"
        ]
    };

    /*
     * 이미지에서 대표 색상 추출
     */
    function extractColors(imageSources) {
        const extractedColors = [];
        let loadedCount = 0;

        imageSources.forEach(function(source) {
            const image = new Image();

            image.onload = function() {
                try {
                    const canvas = document.createElement("canvas");
                    const context = canvas.getContext("2d");

                    canvas.width = 40;
                    canvas.height = 40;

                    context.drawImage(image, 0, 0, 40, 40);

                    const pixels = context.getImageData(
                        0, 0, 40, 40
                    ).data;

                    for (let i = 0; i < pixels.length; i += 16) {
                        const red = pixels[i];
                        const green = pixels[i + 1];
                        const blue = pixels[i + 2];
                        const alpha = pixels[i + 3];

                        if (alpha < 150) continue;

                        /*
                         * 너무 어둡거나 밝은 색은 제외
                         * 공에 잘 보이는 색 위주로 선택
                         */
                        const brightness =
                            (red + green + blue) / 3;

                        if (brightness < 25 || brightness > 245) {
                            continue;
                        }

                        extractedColors.push(
                            "rgb(" +
                            red + "," +
                            green + "," +
                            blue +
                            ")"
                        );
                    }
                } catch (error) {
                    console.log("색상 추출 실패:", error);
                }

                loadedCount++;

                /*
                 * 모든 사진을 읽으면 해당 작품의 색상 적용
                 */
                if (loadedCount === imageSources.length) {
                    if (extractedColors.length > 0) {
                        currentColors = extractedColors;
                    } else {
                        currentColors = defaultColors;
                    }
                }
            };

            image.onerror = function() {
                loadedCount++;

                if (loadedCount === imageSources.length) {
                    if (extractedColors.length > 0) {
                        currentColors = extractedColors;
                    } else {
                        currentColors = defaultColors;
                    }
                }
            };

            image.src = source;
        });
    }

    /*
     * 현재 페이지 확인
     */
    function updatePageColors() {
        const currentPage = window.location.hash.replace("#", "");

        if (pageImages[currentPage]) {
            currentColors = defaultColors;

            extractColors(pageImages[currentPage]);
        } else {
            currentColors = defaultColors;
        }
    }

    /*
     * 공 생성
     */
    for (let i = 0; i < ballCount; i++) {
        const ball = document.createElement("div");

        ball.className = "cursor-ball";

        if (i === 0) {
            /* 첫 번째 공: 흰색 + 얇은 검정 테두리 */
            ball.style.backgroundColor = "#ffffff";
            ball.style.border = "1px solid #000000";
            ball.style.width = "20px";
            ball.style.height = "20px";
            ball.style.zIndex = "10000";
            ball.style.display = "block";
        } else {
            /* 뒤따라오는 공 */
            ball.style.backgroundColor = defaultColors[
                Math.floor(Math.random() * defaultColors.length)
            ];

            ball.style.width =
                (12 + Math.random() * 10) + "px";

            ball.style.height = ball.style.width;
            ball.style.zIndex = "9999";
            ball.style.display = "none";
        }

        trail.appendChild(ball);

        balls.push({
            element: ball,
            x: mouseX,
            y: mouseY,
            colorIndex: 0
        });
    }

    /*
     * 페이지가 열릴 때 색상 변경
     */
    window.addEventListener("hashchange", function() {
        updatePageColors();
    });

    updatePageColors();

    /*
     * 마우스 위치 추적
     */
    document.addEventListener("mousemove", function(event) {
        mouseX = event.clientX;
        mouseY = event.clientY;

        isMoving = true;

        balls.forEach(function(ball, index) {
            if (index > 0) {
                ball.element.style.display = "block";
            }
        });

        clearTimeout(moveTimer);

        moveTimer = setTimeout(function() {
            isMoving = false;
            waitUntilBallsArrive();
        }, 180);
    });

    /*
     * 마지막 공까지 도착하면 뒤따라오는 공 숨김
     */
    function waitUntilBallsArrive() {
        const lastBall = balls[balls.length - 1];

        const distance = Math.hypot(
            lastBall.x - mouseX,
            lastBall.y - mouseY
        );

        if (distance < 1) {
            balls.forEach(function(ball, index) {
                if (index > 0) {
                    ball.element.style.display = "none";
                }
            });
        } else {
            setTimeout(waitUntilBallsArrive, 30);
        }
    }

    /*
     * 공들이 차례대로 따라오게 만들기
     */
    function animate() {
        let targetX = mouseX;
        let targetY = mouseY;

        balls.forEach(function(ball, index) {
            ball.x += (targetX - ball.x) * 0.28;
            ball.y += (targetY - ball.y) * 0.28;

            ball.element.style.left = ball.x + "px";
            ball.element.style.top = ball.y + "px";

            /*
             * 첫 번째 흰색 공을 제외하고
             * 현재 작품의 사진에서 추출한 색으로 랜덤 변경
             */
            if (
                index !== 0 &&
                isMoving &&
                currentColors.length > 0 &&
                Math.random() < 0.08
            ) {
                ball.colorIndex = Math.floor(
                    Math.random() * currentColors.length
                );

                ball.element.style.backgroundColor =
                    currentColors[ball.colorIndex];
            }

            targetX = ball.x;
            targetY = ball.y;
        });

        requestAnimationFrame(animate);
    }

    animate();
</script>
