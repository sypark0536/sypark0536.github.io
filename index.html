
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parkseoyeon</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background-color: #d4d4d4;
            color: #000;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            font-weight: normal;
            text-transform: none;
        }

        a {
            color: #000;
            text-decoration: none;
            text-transform: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* 기본 화면 */
        #home-page {
            display: block;
            min-height: 100vh;
            padding: 24px;
        }

        /* 내부 페이지 기본 숨김 */
        #work-page,
        #statement-page,
        #cv-page,
        #dolbom-page {
            display: none;
            min-height: 100vh;
            padding: 24px;
        }

        /* 주소 뒤에 해당 해시가 붙었을 때 표시 */
        #work-page:target,
        #statement-page:target,
        #cv-page:target,
        #dolbom-page:target {
            display: block;
        }

        /* 내부 페이지가 열리면 메인 화면 숨김 */
        #work-page:target ~ #home-page,
        #statement-page:target ~ #home-page,
        #cv-page:target ~ #home-page,
        #dolbom-page:target ~ #home-page {
            display: none;
        }

        /* 공통 헤더 */
        .site-name {
            position: absolute;
            top: 24px;
            left: 24px;
            font-size: 16px;
        }

        .page-title {
            position: absolute;
            top: 24px;
            right: 24px;
            font-size: 16px;
        }

        /* 메인 목차 */
        .menu {
            position: absolute;
            top: 90px;
            left: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu a {
            display: block;
            width: fit-content;
        }

        /* 내부 페이지 내용 */
        .back {
    display: block;
    margin-top: 80px;
    font-size: 16px;
        }

        .page-content {
            padding-top: 130px;
            max-width: 700px;
            line-height: 1.5;
        }

        /* 작품 목록 */
        .work-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 돌 봄 작품 사진 세로 배치 */
        .work-gallery {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .work-gallery img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* 사진 아래 뒤로가기 */
        .gallery-back {
            display: block;
            margin-top: 40px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        /* 커서 공들이 들어가는 공간 */
        #cursor-trail {
            position: relative;
            z-index: 9999;
        }

        /* 커서 공 */
        .cursor-ball {
            position: fixed;
            top: 0;
            left: 0;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            display: none;
        }

        /* 마우스를 사용하는 화면에서만 커스텀 커서 적용 */
        @media (hover: hover) and (pointer: fine) {
            body,
            a {
                cursor: none;
            }

            .cursor-ball {
                display: block;
            }
        }

        /* 모바일 화면 */
        @media (max-width: 600px) {
            #home-page,
            #work-page,
            #statement-page,
            #cv-page,
            #dolbom-page {
                padding: 20px;
            }

            .site-name {
                top: 20px;
                left: 20px;
            }

            .page-title {
                top: 20px;
                right: 20px;
            }

            .menu {
                top: 80px;
                left: 20px;
            }

            .page-content {
                padding-top: 120px;
            }
        }
    </style>
</head>

<body>

    <!-- 커서 공들이 들어갈 공간 -->
    <div id="cursor-trail"></div>

    <!-- 작품 목록 페이지 -->
    <section id="work-page">
        <div class="site-name">Parkseoyeon</div>

        <a class="back" href="index.html">←</a>

        <div class="page-title">Work</div>

        <div class="page-content">
            <div class="work-list">
                <a href="#">Everything is life 2023</a>
                <a href="#">Inner place 2024</a>
                <a href="#">Inner place (un - labeled) 2024</a>
                <a href="#dolbom-page">돌 봄 2025</a>
                <a href="#">이렇게 밥상에 모였다. 2026</a>
            </div>
        </div>
    </section>

    <!-- 돌 봄 작품 페이지 -->
    <section id="dolbom-page">
        <div class="site-name">Parkseoyeon</div>

        <div class="page-title">돌 봄 2025</div>

        <div class="page-content">
            <div class="work-gallery">

                <!-- 1번과 2번 사진 순서 교체 -->
                <img src="DSC01305.JPG" alt="돌 봄 2025 작품 사진 1">

                <img src="DSC01300.JPG" alt="돌 봄 2025 작품 사진 2">

                <img src="DSC01312.JPG" alt="돌 봄 2025 작품 사진 3">

                <img src="DSC01313.JPG" alt="돌 봄 2025 작품 사진 4">

                <img src="DSC01432.JPG" alt="돌 봄 2025 작품 사진 5">

                <img src="DSC01437.JPG" alt="돌 봄 2025 작품 사진 6">

                <img src="DSC01438.JPG" alt="돌 봄 2025 작품 사진 7">

                <img src="DSC01440.JPG" alt="돌 봄 2025 작품 사진 8">

            </div>

            <!-- 사진 맨 아래 뒤로가기 -->
            <a class="gallery-back" href="#work-page">←</a>
        </div>
    </section>

    <!-- Artist statement 페이지 -->
    <section id="statement-page">
        <div class="site-name">Parkseoyeon</div>

        <a class="back" href="index.html">←</a>

        <div class="page-title">Artist statement</div>

        <div class="page-content">
            Artist statement
        </div>
    </section>

    <!-- CV 페이지 -->
    <section id="cv-page">
        <div class="site-name">Parkseoyeon</div>

        <a class="back" href="index.html">←</a>

        <div class="page-title">CV</div>

        <div class="page-content">
            CV
        </div>
    </section>

    <!-- 메인 페이지 -->
    <section id="home-page">
        <div class="site-name">Parkseoyeon</div>

        <nav class="menu">
            <a href="#statement-page">Artist statement</a>
            <a href="#cv-page">CV</a>
            <a href="#work-page">Work</a>
        </nav>
    </section>

    <script>
        const trail = document.getElementById("cursor-trail");

        const balls = [];
        const ballCount = 14;

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        let isMoving = false;
        let moveTimer;

        const colors = [
            "#ff69b4",
            "#ff1493",
            "#ff8fab",
            "#ffb3c6",
            "#c77dff",
            "#9d4edd",
            "#7b2cbf",
            "#00b4d8",
            "#48cae4",
            "#90be6d",
            "#f9c74f",
            "#f9844a",
            "#f94144"
        ];

        /* 공 생성 */
        for (let i = 0; i < ballCount; i++) {
            const ball = document.createElement("div");

            ball.className = "cursor-ball";

            if (i === 0) {
                /* 첫 번째 공: 흰색 + 얇은 검정 테두리 */
                ball.style.backgroundColor = "#ffffff";
                ball.style.border = "1px solid #000000";
                ball.style.width = "20px";
                ball.style.height = "20px";
                ball.style.zIndex = "10000";
                ball.style.display = "block";
            } else {
                /* 뒤따라오는 공: 처음에는 숨김 */
                ball.style.backgroundColor =
                    colors[Math.floor(Math.random() * colors.length)];

                ball.style.width = (12 + Math.random() * 10) + "px";
                ball.style.height = ball.style.width;
                ball.style.zIndex = "9999";
                ball.style.display = "none";
            }

            trail.appendChild(ball);

            balls.push({
                element: ball,
                x: mouseX,
                y: mouseY,
                colorIndex: Math.floor(Math.random() * colors.length)
            });
        }

        /* 마우스 위치 추적 */
        document.addEventListener("mousemove", function(event) {
            mouseX = event.clientX;
            mouseY = event.clientY;

            isMoving = true;

            /* 뒤따라오는 공 표시 */
            balls.forEach(function(ball, index) {
                if (index > 0) {
                    ball.element.style.display = "block";
                }
            });

            clearTimeout(moveTimer);

            moveTimer = setTimeout(function() {
                isMoving = false;
                waitUntilBallsArrive();
            }, 180);
        });

        /*
         * 마지막 공까지 앞 공의 위치에 도착한 뒤
         * 뒤따라오는 공들을 숨김
         */
        function waitUntilBallsArrive() {
            const lastBall = balls[balls.length - 1];

            const distance = Math.hypot(
                lastBall.x - mouseX,
                lastBall.y - mouseY
            );

            if (distance < 1) {
                balls.forEach(function(ball, index) {
                    if (index > 0) {
                        ball.element.style.display = "none";
                    }
                });
            } else {
                setTimeout(waitUntilBallsArrive, 30);
            }
        }

        /* 공들이 차례대로 따라오게 만들기 */
        function animate() {
            let targetX = mouseX;
            let targetY = mouseY;

            balls.forEach(function(ball, index) {
                ball.x += (targetX - ball.x) * 0.28;
                ball.y += (targetY - ball.y) * 0.28;

                ball.element.style.left = ball.x + "px";
                ball.element.style.top = ball.y + "px";

                if (index !== 0 && isMoving && Math.random() < 0.08) {
                    ball.colorIndex =
                        Math.floor(Math.random() * colors.length);

                    ball.element.style.backgroundColor =
                        colors[ball.colorIndex];
                }

                targetX = ball.x;
                targetY = ball.y;
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>

</body>
</html>
