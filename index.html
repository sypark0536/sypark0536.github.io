<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parkseoyeon</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background-color: #d4d4d4;
            color: #000;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            font-weight: normal;
            text-transform: none;
        }

        a {
            color: #000;
            text-decoration: none;
            text-transform: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* 기본 화면 */
        #home-page {
            display: block;
            min-height: 100vh;
            padding: 24px;
        }

        /* 내부 페이지 기본 숨김 */
        #work-page,
        #statement-page,
        #cv-page {
            display: none;
            min-height: 100vh;
            padding: 24px;
        }

        /* 주소 뒤에 해당 해시가 붙었을 때만 표시 */
        #work-page:target,
        #statement-page:target,
        #cv-page:target {
            display: block;
        }

        /* 내부 페이지가 열리면 메인 화면 숨김 */
        #work-page:target ~ #home-page,
        #statement-page:target ~ #home-page,
        #cv-page:target ~ #home-page {
            display: none;
        }

        /* 공통 헤더 */
        .site-name {
            position: absolute;
            top: 24px;
            left: 24px;
            font-size: 16px;
        }

        .page-title {
            position: absolute;
            top: 24px;
            right: 24px;
            font-size: 16px;
        }

        /* 메인 목차 */
        .menu {
            position: absolute;
            top: 90px;
            left: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu a {
            display: block;
            width: fit-content;
        }

        /* 내부 페이지 내용 */
        .back {
            position: absolute;
            top: 52px;
            left: 24px;
            font-size: 16px;
        }

        .page-content {
            padding-top: 130px;
            max-width: 700px;
            line-height: 1.5;
        }

        /* 작품 목록 */
        .work-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 핑크색 커서 */
        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 18px;
            height: 18px;
            background-color: #ff69b4;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            display: none;
        }

        /* 마우스를 사용하는 화면에서만 커스텀 커서 적용 */
        @media (hover: hover) and (pointer: fine) {
            body,
            a {
                cursor: none;
            }

            .custom-cursor {
                display: block;
            }
        }

        /* 모바일 화면 */
        @media (max-width: 600px) {
            #home-page,
            #work-page,
            #statement-page,
            #cv-page {
                padding: 20px;
            }

            .site-name {
                top: 20px;
                left: 20px;
            }

            .page-title {
                top: 20px;
                right: 20px;
            }

            .menu {
                top: 80px;
                left: 20px;
            }

            .back {
                top: 48px;
                left: 20px;
            }

            .page-content {
                padding-top: 120px;
            }
        }
    </style>
</head>

<body>

    <!-- 핑크색 커서 -->
    <div class="custom-cursor"></div>

    <!-- 작품 페이지 -->
    <section id="work-page">
        <div class="site-name">Parkseoyeon</div>

        <a class="back" href="index.html">←</a>

        <div class="page-title">Work</div>

        <div class="page-content">
            <div class="work-list">
                <a href="#">Everything is life 2023</a>
                <a href="#">Inner place 2024</a>
                <a href="#">Inner place (un - labeled) 2024</a>
                <a href="#">돌 봄 2025</a>
                <a href="#">이렇게 밥상에 모였다. 2026</a>
            </div>
        </div>
    </section>

    <!-- Artist statement 페이지 -->
    <section id="statement-page">
        <div class="site-name">Parkseoyeon</div>

        <a class="back" href="index.html">←</a>

        <div class="page-title">Artist statement</div>

        <div class="page-content">
            Artist statement
        </div>
    </section>

    <!-- CV 페이지 -->
    <section id="cv-page">
        <div class="site-name">Parkseoyeon</div>

        <a class="back" href="index.html">←</a>

        <div class="page-title">CV</div>

        <div class="page-content">
            CV
        </div>
    </section>

    <!-- 메인 페이지 -->
    <section id="home-page">
        <div class="site-name">Parkseoyeon</div>

        <nav class="menu">
            <a href="#statement-page">Artist statement</a>
            <a href="#cv-page">CV</a>
            <a href="#work-page">Work</a>
        </nav>
    </section>

    <script>
        const cursor = document.querySelector(".custom-cursor");

        document.addEventListener("mousemove", function(event) {
            cursor.style.left = event.clientX + "px";
            cursor.style.top = event.clientY + "px";
        });
    </script>

</body>
</html>
