
<!DOCTYPE html>

    <style>

        body {
            background-color: #d4d4d4;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            color: #111;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        h1 {
            font-size: 24px;

            margin: 0;
        }

            color: #111;
            text-decoration: none;
        }

        .back:hover,

        }

            font-weight: normal;
        }

        p {
            font-size: 16px;
            line-height: 1.5;
        }

        /* 작품 리스트 화면 */
        #work-page {
            display: none;
        }

        #work-page:target {
            display: block;
        }

        #work-page:target ~ #home-page {
            display: none;
        }

        .work-list {
            margin-top: 50px;
        }

        .work-item {
            margin-bottom: 20px;
            font-size: 20px;
        }

        .work-item a {
            color: #111;
            text-decoration: none;
        }

        .work-item a:hover {
            text-decoration: underline;
        }
    </style>
</head>
